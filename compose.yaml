services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB?задай POSTGRES_DB в .env}
      POSTGRES_USER: ${POSTGRES_USER:?задай POSTGRES_USER в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env}
    volumes:
      # для PostgreSQL 18 том монтируется в /var/lib/postgresql, а не в .../data
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
